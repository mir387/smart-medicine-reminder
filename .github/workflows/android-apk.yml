
name: Build CareCue Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "loading.html"
      - "auth.html"
      - "assets/**"
      - "native-notifications-entry.js"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/local-notifications @capacitor/app
          npm install --save-dev @capacitor/cli esbuild

          mkdir -p www/assets
          cp index.html www/app.html
          cp loading.html www/index.html
          cp auth.html www/auth.html
          cp -R assets/. www/assets/

          npx esbuild native-notifications-entry.js \
            --bundle \
            --platform=browser \
            --format=iife \
            --outfile=www/native-notifications.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.carecue.app",
            "appName": "CareCue",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android
          
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          marker = '                <category android:name="android.intent.category.LAUNCHER" />'
          if marker not in text:
              raise SystemExit("ERROR: Launcher intent-filter marker not found.")

          deep_link = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.carecue.app" android:host="auth" android:path="/callback" />
                  </intent-filter>
          '''

          if 'android:scheme="com.carecue.app"' not in text:
              text = text.replace(marker, marker + '\n' + deep_link, 1)
              path.write_text(text)

          print("CareCue deep link registration added.")
          PY
          

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CareCue-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
          
