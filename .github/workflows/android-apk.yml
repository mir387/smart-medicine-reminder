
name: Build CareCue Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "loading.html"
      - "auth.html"
      - "assets/**"
      - "native-notifications-entry.js"
      - "auth-native-entry.js"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/local-notifications @capacitor/app
          npm install --save-dev @capacitor/cli esbuild

          mkdir -p www/assets
          cp index.html www/app.html
          cp loading.html www/index.html
          cp auth.html www/auth.html
          cp -R assets/. www/assets/

          npx esbuild native-notifications-entry.js \
            --bundle \
            --platform=browser \
            --format=iife \
            --outfile=www/native-notifications.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.carecue.app",
            "appName": "CareCue",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android"
          )

          path = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(path)
          root = tree.getroot()

          android = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")

          if app is None:
              raise SystemExit("ERROR: Android application element not found.")

          activity = next(
              (
                  item for item in app.findall("activity")
                  if item.get(android + "name", "").endswith("MainActivity")
              ),
              None
          )

          if activity is None:
              raise SystemExit("ERROR: MainActivity not found.")

          exists = any(
              any(
                  data.get(android + "scheme") == "com.carecue.app"
                  and data.get(android + "host") == "auth"
                  and data.get(android + "path") == "/callback"
                  for data in intent.findall("data")
              )
              for intent in activity.findall("intent-filter")
          )

          if not exists:
              intent = ET.SubElement(activity, "intent-filter")

              ET.SubElement(intent, "action", {
                  android + "name": "android.intent.action.VIEW"
              })

              ET.SubElement(intent, "category", {
                  android + "name": "android.intent.category.DEFAULT"
              })

              ET.SubElement(intent, "category", {
                  android + "name": "android.intent.category.BROWSABLE"
              })

              ET.SubElement(intent, "data", {
                  android + "scheme": "com.carecue.app",
                  android + "host": "auth",
                  android + "path": "/callback"
              })

              tree.write(
                  path,
                  encoding="utf-8",
                  xml_declaration=True
              )

          print("CareCue deep link registration verified.")

          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CareCue-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
