
name: Build CareCue Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "native-notifications-entry.js"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/local-notifications
          npm install --save-dev @capacitor/cli esbuild

          mkdir -p www
          cp index.html www/index.html

          npx esbuild native-notifications-entry.js \
            --bundle \
            --platform=browser \
            --format=iife \
            --outfile=www/native-notifications.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.carecue.app",
            "appName": "CareCue",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CareCue-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
