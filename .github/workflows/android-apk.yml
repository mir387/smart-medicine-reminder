name: Build CareCue Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "loading.html"
      - "auth.html"
      - "account.html"
      - "assets/**"
      - "native-notifications-entry.js"
      - "auth-native-entry.js"
      - "src/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Capacitor project
        run: |
          npm install
          npm run build || true

          mkdir -p www/assets
          if [ -d "dist" ]; then
            cp -R dist/* www/
            cp dist/index.html www/app.html
          else
            cp index.html www/app.html
          fi

          cp loading.html www/index.html
          cp auth.html www/auth.html
          cp account.html www/account.html
          cp -R assets/. www/assets/

          npx esbuild native-notifications-entry.js \
            --bundle \
            --platform=browser \
            --format=iife \
            --outfile=www/native-notifications.js
          
          npx esbuild auth-native-entry.js \
            --bundle \
            --platform=browser \
            --format=iife \
            --outfile=www/auth-native.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.carecue.app",
            "appName": "CareCue",
            "webDir": "www",
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_icon_config_sample",
                "iconColor": "#087F73",
                "sound": "beep.wav"
              }
            }
          }
          EOF

          npx cap add android
          npx cap sync android

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android"
          )

          path = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(path)
          root = tree.getroot()

          android = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")

          if app is None:
              raise SystemExit("ERROR: Android application element not found.")

          # 1. Add required notification permissions for Android 13+ (POST_NOTIFICATIONS),
          # exact alarms (Doze mode), vibration, and boot receivers
          required_permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.USE_EXACT_ALARM",
              "android.permission.VIBRATE",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.WAKE_LOCK"
          ]

          existing_perms = {
              elem.get(android + "name")
              for elem in root.findall("uses-permission")
          }

          for perm in required_permissions:
              if perm not in existing_perms:
                  ET.SubElement(root, "uses-permission", {
                      android + "name": perm
                  })
                  print(f"Added permission: {perm}")

          # 2. Add BootReceiver and notification action receivers so reminders survive reboots
          existing_receivers = {
              elem.get(android + "name")
              for elem in app.findall("receiver")
          }

          boot_receiver_name = "com.capacitorjs.plugins.localnotifications.TimedNotificationPublisher$BootReceiver"
          if boot_receiver_name not in existing_receivers:
              receiver = ET.SubElement(app, "receiver", {
                  android + "name": boot_receiver_name,
                  android + "exported": "true"
              })
              intent = ET.SubElement(receiver, "intent-filter")
              ET.SubElement(intent, "action", {
                  android + "name": "android.intent.action.BOOT_COMPLETED"
              })
              ET.SubElement(intent, "action", {
                  android + "name": "android.intent.action.QUICKBOOT_POWERON"
              })
              ET.SubElement(intent, "action", {
                  android + "name": "com.htc.intent.action.QUICKBOOT_POWERON"
              })
              print("Added LocalNotifications BootReceiver")

          # 3. Add OAuth deep link filter to MainActivity
          activity = next(
              (
                  item for item in app.findall("activity")
                  if item.get(android + "name", "").endswith("MainActivity")
              ),
              None
          )

          if activity is None:
              raise SystemExit("ERROR: MainActivity not found.")

          exists = any(
              any(
                  data.get(android + "scheme") == "com.carecue.app"
                  and data.get(android + "host") == "auth"
                  and data.get(android + "path") == "/callback"
                  for data in intent.findall("data")
              )
              for intent in activity.findall("intent-filter")
          )

          if not exists:
              intent = ET.SubElement(activity, "intent-filter")

              ET.SubElement(intent, "action", {
                  android + "name": "android.intent.action.VIEW"
              })

              ET.SubElement(intent, "category", {
                  android + "name": "android.intent.category.DEFAULT"
              })

              ET.SubElement(intent, "category", {
                  android + "name": "android.intent.category.BROWSABLE"
              })

              ET.SubElement(intent, "data", {
                  android + "scheme": "com.carecue.app",
                  android + "host": "auth",
                  android + "path": "/callback"
              })

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("CareCue Android notification & deep link registration verified.")

          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CareCue-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
