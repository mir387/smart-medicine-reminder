<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>My Account — CareCue</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5faf8;
      color: #173b35;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e3eeea;
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
      color: #0f766e;
    }

    .back-button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: #e6f5f0;
      color: #0f766e;
      font-weight: 700;
      cursor: pointer;
    }

    main {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 18px;
    }

    .profile-card {
      background: white;
      border: 1px solid #e3eeea;
      border-radius: 22px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 6px 22px rgba(15, 118, 110, 0.06);
    }

    .avatar {
      width: 78px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #d9f4eb;
      color: #0f766e;
      font-size: 30px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .subtitle {
      margin: 0;
      color: #718580;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .section-title {
      margin: 26px 4px 12px;
      font-size: 15px;
      font-weight: 800;
    }

    .details-card {
      background: white;
      border: 1px solid #e3eeea;
      border-radius: 18px;
      padding: 6px 16px;
    }

    .detail-row {
      padding: 15px 0;
      border-bottom: 1px solid #edf3f0;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      display: block;
      margin-bottom: 7px;
      color: #718580;
      font-size: 12px;
    }

    .detail-value {
      width: 100%;
      border: 1px solid #e0eae5;
      border-radius: 10px;
      padding: 12px;
      background: #fbfdfc;
      color: #173b35;
      font-size: 15px;
    }

    .detail-value[readonly] {
      background: #f3f8f6;
    }

    .primary-button,
    .secondary-button,
    .signout-button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button {
      background: #0f766e;
      color: white;
    }

    .secondary-button {
      background: #e6f5f0;
      color: #0f766e;
    }

    .signout-button {
      background: #fff0ef;
      color: #c62828;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      min-height: 20px;
      margin: 12px 0 0;
      text-align: center;
      font-size: 13px;
      color: #0f766e;
      overflow-wrap: anywhere;
    }

    .status.error {
      color: #c62828;
    }

    .footer-note {
      margin-top: 28px;
      text-align: center;
      color: #718580;
      font-size: 12px;
    }

    .carecue-brand {
      text-align: center;
      padding: 12px 16px 28px;
      font-size: 12px;
      color: #718580;
      letter-spacing: 0.3px;
    }

    .carecue-brand span {
      color: #e53935;
      font-weight: 800;
      letter-spacing: 0.6px;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">CareCue</div>
    <button class="back-button" id="backButton" type="button">
      ← Back
    </button>
  </header>

  <main>
    <section class="profile-card">
      <div class="avatar" id="avatar">C</div>
      <h1 id="displayName">My Account</h1>
      <p class="subtitle" id="displayEmail">Loading account...</p>
    </section>

    <h2 class="section-title">Personal information</h2>

    <section class="details-card">
      <div class="detail-row">
        <label class="detail-label" for="fullName">Full name</label>
        <input
          class="detail-value"
          id="fullName"
          type="text"
          maxlength="100"
          placeholder="Enter your full name"
          autocomplete="name"
        >
      </div>

      <div class="detail-row">
        <label class="detail-label" for="email">Email address</label>
        <input
          class="detail-value"
          id="email"
          type="email"
          readonly
        >
      </div>

      <div class="detail-row">
        <label class="detail-label" for="phone">Phone number</label>
        <input
          class="detail-value"
          id="phone"
          type="tel"
          maxlength="20"
          placeholder="Enter phone number (optional)"
          autocomplete="tel"
        >
      </div>
    </section>

    <button class="primary-button" id="saveButton" type="button">
      Save changes
    </button>

    <h2 class="section-title">Account settings</h2>

    <button class="secondary-button" id="remindersButton" type="button">
      Medicine reminders
    </button>

    <button class="secondary-button" id="homeButton" type="button">
      Go to home
    </button>

    <button class="signout-button" id="signOutButton" type="button">
      Sign out
    </button>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <footer class="footer-note">
      CareCue · Your health, your routine.
    </footer>
  </main>

  <div class="carecue-brand">
    Created by <span>MIR MD. TOUHID</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Existing CareCue Supabase project settings
    const SUPABASE_URL =
      "https://suvrmmuwvxtvghgbtnvs.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_WAdWbVJxrp0JKGe0qV06_A_fcPAyjsb";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const $ = (id) => document.getElementById(id);

    let currentUser = null;

    function showStatus(message, isError = false) {
      $("status").textContent = message;
      $("status").classList.toggle("error", isError);
    }

    function goHome() {
      // Change this destination if your dashboard uses another filename.
      window.location.href = "./index.html";
    }

    function setProfileDisplay(name, email) {
      const cleanName = (name || "").trim();
      $("displayName").textContent = cleanName || "My Account";
      $("displayEmail").textContent = email || "";

      const initialSource = cleanName || email || "C";
      $("avatar").textContent = initialSource.charAt(0).toUpperCase();
    }

    async function startAccount() {
      try {
        if (!window.supabase) {
          showStatus(
            "Could not load the account service. Check your internet connection.",
            true
          );
          return;
        }

        const { data, error } = await supabaseClient.auth.getSession();

        if (error) throw error;

        currentUser = data.session?.user;

        if (!currentUser) {
          window.location.replace("./auth.html");
          return;
        }

        const email = currentUser.email || "";

        $("email").value = email;
        $("displayEmail").textContent = email;

        const { data: profile, error: profileError } =
          await supabaseClient
            .from("profiles")
            .select("full_name, phone")
            .eq("id", currentUser.id)
            .maybeSingle();

        if (profileError) {
          console.error("Profile loading error:", profileError);
          showStatus(
            "Signed in, but profile details could not be loaded. Check your profiles table and permissions.",
            true
          );
          setProfileDisplay("", email);
          return;
        }

        const fullName = profile?.full_name || "";
        const phone = profile?.phone || "";

        $("fullName").value = fullName;
        $("phone").value = phone;

        setProfileDisplay(fullName, email);
        showStatus("Account loaded successfully.");
      } catch (error) {
        console.error("Account loading error:", error);
        showStatus(
          error.message || "Unable to load your account.",
          true
        );
      }
    }

    async function saveProfile() {
      if (!currentUser) {
        showStatus("Please sign in again.", true);
        return;
      }

      const fullName = $("fullName").value.trim();
      const phone = $("phone").value.trim();

      if (fullName.length > 100 || phone.length > 20) {
        showStatus("Please check the name and phone number.", true);
        return;
      }

      $("saveButton").disabled = true;
      showStatus("Saving your changes...");

      try {
        const { error } = await supabaseClient
          .from("profiles")
          .upsert(
            {
              id: currentUser.id,
              full_name: fullName,
              phone: phone
            },
            { onConflict: "id" }
          );

        if (error) throw error;

        setProfileDisplay(fullName, currentUser.email || "");
        showStatus("Your profile has been saved.");
      } catch (error) {
        console.error("Profile save error:", error);
        showStatus(
          error.message ||
          "Could not save changes. Check your profiles table and permissions.",
          true
        );
      } finally {
        $("saveButton").disabled = false;
      }
    }

    async function signOut() {
      const confirmed = window.confirm(
        "Are you sure you want to sign out?"
      );

      if (!confirmed) return;

      $("signOutButton").disabled = true;
      showStatus("Signing out...");

      try {
        const { error } = await supabaseClient.auth.signOut();

        if (error) throw error;

        window.location.replace("./auth.html");
      } catch (error) {
        console.error("Sign-out error:", error);
        showStatus(error.message || "Could not sign out.", true);
        $("signOutButton").disabled = false;
      }
    }

    $("backButton").addEventListener("click", goHome);
    $("homeButton").addEventListener("click", goHome);

    $("remindersButton").addEventListener("click", () => {
      window.location.href = "./index.html";
    });

    $("saveButton").addEventListener("click", saveProfile);
    $("signOutButton").addEventListener("click", signOut);

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT" || !session) {
        window.location.replace("./auth.html");
      }
    });

    startAccount();
  </script>
</body>
</html>
