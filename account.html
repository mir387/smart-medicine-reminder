
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>My Account | CareCue</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0f766e;
      --dark: #115e59;
      --bg: #f4f8f7;
      --text: #183b36;
      --muted: #718580;
      --border: #e2ece8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input { font: inherit; }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .back {
      color: var(--primary);
      background: none;
      border: 0;
      padding: 10px 0;
      font-weight: 650;
    }

    .brand {
      font-size: 21px;
      font-weight: 850;
      color: var(--primary);
    }

    main {
      width: min(100% - 32px, 520px);
      margin: 22px auto 40px;
    }

    .welcome {
      text-align: center;
      padding: 20px 8px 24px;
    }

    .avatar {
      width: 82px;
      height: 82px;
      margin: 0 auto 15px;
      border-radius: 27px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #c9f1e8, #e5f0ff);
      color: var(--dark);
      font-size: 32px;
      font-weight: 800;
      box-shadow: 0 8px 25px #0f766e12;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 7px;
      letter-spacing: -.5px;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px #183b3605;
    }

    .card-title {
      font-size: 16px;
      font-weight: 750;
      margin: 0 0 18px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid #dce8e4;
      border-radius: 12px;
      padding: 12px;
      color: var(--text);
      background: #fbfdfc;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px #0f766e14;
    }

    input[readonly] {
      background: #f1f5f4;
      color: #647772;
    }

    .btn {
      width: 100%;
      min-height: 46px;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
    }

    .primary {
      color: white;
      background: var(--primary);
      border: 1px solid var(--primary);
    }

    .secondary {
      color: var(--primary);
      background: white;
      border: 1px solid #cfe2dd;
    }

    .danger {
      color: #b42332;
      background: white;
      border: 1px solid #f0d5d8;
    }

    .menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px 0;
      text-align: left;
      color: var(--text);
      background: white;
      border: 0;
      border-bottom: 1px solid #edf2f0;
    }

    .menu-item:last-child { border-bottom: 0; }

    .menu-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #e9f7f3;
      font-size: 20px;
      flex-shrink: 0;
    }

    .menu-copy { flex: 1; }

    .menu-copy strong {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .menu-copy small {
      color: var(--muted);
      font-size: 12px;
    }

    .arrow {
      color: #91a49e;
      font-size: 23px;
    }

    .status {
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .status.show { display: block; }

    .status.error {
      background: #fff0f0;
      color: #a12632;
    }

    .status.success {
      background: #e9f8f0;
      color: #176447;
    }

    .status.info {
      background: #edf6ff;
      color: #245b85;
    }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 12px 0 25px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .card { animation: appear .25s ease-out; }
      @keyframes appear {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <button class="back" id="backBtn" type="button">← Back</button>
    <div class="brand">CareCue</div>
    <div style="width:42px"></div>
  </header>

  <main>
    <section class="welcome">
      <div class="avatar" id="avatar">C</div>
      <h1 id="welcomeName">My Account</h1>
      <div class="muted" id="welcomeEmail">Loading your account…</div>
    </section>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <section class="card">
      <h2 class="card-title">Personal information</h2>

      <form id="profileForm">
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" type="text" maxlength="100"
                 placeholder="Enter your full name" required>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" readonly>
        </div>

        <div class="field">
          <label for="phone">Phone number (optional)</label>
          <input id="phone" type="tel" maxlength="20"
                 autocomplete="tel" placeholder="Enter phone number">
        </div>

        <button class="btn primary" id="saveBtn" type="submit">
          Save changes
        </button>
      </form>
    </section>

    <section class="card">
      <h2 class="card-title">Your CareCue</h2>

      <button class="menu-item" type="button" id="remindersBtn">
        <span class="menu-icon">⏰</span>
        <span class="menu-copy">
          <strong>Medicine reminders</strong>
          <small>Open your reminder dashboard</small>
        </span>
        <span class="arrow">›</span>
      </button>

      <button class="menu-item" type="button" id="privacyBtn">
        <span class="menu-icon">🔒</span>
        <span class="menu-copy">
          <strong>Privacy & security</strong>
          <small>Your account and personal information</small>
        </span>
        <span class="arrow">›</span>
      </button>

      <button class="menu-item" type="button" id="helpBtn">
        <span class="menu-icon">💬</span>
        <span class="menu-copy">
          <strong>Help & feedback</strong>
          <small>Get help using CareCue</small>
        </span>
        <span class="arrow">›</span>
      </button>
    </section>

    <section class="card">
      <h2 class="card-title">Account</h2>
      <p class="muted">
        Sign out of your current CareCue account on this device.
      </p>
      <button class="btn danger" id="signOutBtn" type="button">
        Sign out
      </button>
    </section>

    <footer>CareCue · Your health, your routine.</footer>
  </main>

  <script>
    /*
      IMPORTANT:
      Replace the placeholder below with the SAME Supabase
      publishable/anon key already used in auth.html.
      Never use a service_role key in this file.
    */
    const SUPABASE_URL = "https://suvrmmuwvxtvghgbtnvs.supabase.co";
    const SUPABASE_KEY = "PASTE_YOUR_EXISTING_SUPABASE_ANON_OR_PUBLISHABLE_KEY_HERE";

    const statusBox = document.getElementById("status");
    const saveBtn = document.getElementById("saveBtn");
    const signOutBtn = document.getElementById("signOutBtn");

    let supabaseClient;
    let currentUser = null;

    function showStatus(message, type = "info") {
      statusBox.textContent = message;
      statusBox.className = "status show " + type;
    }

    function initials(name) {
      const parts = (name || "CareCue").trim().split(/\s+/);
      return parts.slice(0, 2).map(p => p[0]).join("").toUpperCase();
    }

    async function startAccount() {
      if (!window.supabase) {
        showStatus("Supabase library load nahi hui. Internet connection check karke page reload karo.", "error");
        return;
      }

      if (SUPABASE_KEY.includes("PASTE_YOUR")) {
        showStatus("Setup pending: auth.html se apni existing Supabase public key is file mein paste karo.", "info");
        document.getElementById("welcomeEmail").textContent = "Account setup pending";
        return;
      }

      try {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true
            }
          }
        );

        const { data, error } = await supabaseClient.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          showStatus("Please sign in to view your account.", "info");
          setTimeout(() => {
            window.location.href = "./auth.html";
          }, 1200);
          return;
        }

        currentUser = data.session.user;
        document.getElementById("email").value = currentUser.email || "";
        document.getElementById("welcomeEmail").textContent = currentUser.email || "";

        await loadProfile();

        supabaseClient.auth.onAuthStateChange((event, session) => {
          if (event === "SIGNED_OUT" || !session) {
            window.location.href = "./auth.html";
          }
        });

      } catch (error) {
        showStatus(error.message || "Account load nahi hua. Dobara try karo.", "error");
      }
    }

    async function loadProfile() {
      if (!currentUser) return;

      try {
        const { data, error } = await supabaseClient
          .from("profiles")
          .select("full_name, phone")
          .eq("id", currentUser.id)
          .maybeSingle();

        if (error) throw error;

        const metadata = currentUser.user_metadata || {};
        const name = data?.full_name || metadata.full_name || metadata.name || "";

        document.getElementById("fullName").value = name;
        document.getElementById("phone").value = data?.phone || "";
        document.getElementById("welcomeName").textContent = name || "My Account";
        document.getElementById("avatar").textContent = initials(name);

      } catch (error) {
        showStatus("Profile load nahi hua: " + error.message, "error");
      }
    }

    document.getElementById("profileForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!supabaseClient || !currentUser) {
        showStatus("Pehle sign in karo.", "error");
        return;
      }

      const fullName = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!fullName) {
        showStatus("Please enter your full name.", "error");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving…";

      try {
        const { error } = await supabaseClient
          .from("profiles")
          .upsert({
            id: currentUser.id,
            full_name: fullName,
            phone: phone || null
          }, { onConflict: "id" });

        if (error) throw error;

        document.getElementById("welcomeName").textContent = fullName;
        document.getElementById("avatar").textContent = initials(fullName);
        showStatus("Profile updated successfully!", "success");

      } catch (error) {
        showStatus("Save failed: " + error.message, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save changes";
      }
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "./app.html";
      }
    });

    document.getElementById("remindersBtn").addEventListener("click", () => {
      window.location.href = "./app.html";
    });

    document.getElementById("privacyBtn").addEventListener("click", () => {
      showStatus(
        "Your profile is protected by Supabase authentication and row-level security. Keep your password private.",
        "info"
      );
    });

    document.getElementById("helpBtn").addEventListener("click", () => {
      showStatus(
        "For help, note the problem you faced and contact the CareCue support team when support contact details are available.",
        "info"
      );
    });

    signOutBtn.addEventListener("click", async () => {
      if (!supabaseClient) {
        window.location.href = "./auth.html";
        return;
      }

      if (!confirm("Are you sure you want to sign out?")) return;

      signOutBtn.disabled = true;
      signOutBtn.textContent = "Signing out…";

      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) throw error;
        window.location.href = "./auth.html";
      } catch (error) {
        showStatus("Sign out failed: " + error.message, "error");
        signOutBtn.disabled = false;
        signOutBtn.textContent = "Sign out";
      }
    });

    startAccount();
  </script>
</body>
            </html>
