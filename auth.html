
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>CareCue — Account</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 22px;
      display: grid; place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #f0fdfa, #eff6ff);
      color: #153b38;
    }
    .card {
      width: 100%; max-width: 420px; padding: 28px 22px;
      border-radius: 24px; background: white;
      box-shadow: 0 12px 40px #0f766e16;
    }
    .logo { font-size: 23px; font-weight: 800; color: #0f766e; }
    h1 { margin: 28px 0 8px; font-size: 28px; }
    .sub { color: #64748b; line-height: 1.5; margin-bottom: 24px; }
    label { display: block; margin: 16px 0 7px; font-size: 14px; font-weight: 700; }
    input {
      width: 100%; padding: 14px; border: 1px solid #cbd5e1;
      border-radius: 12px; font-size: 16px; background: white;
    }
    input:focus { outline: 2px solid #99f6e4; border-color: #0f766e; }
    button {
      width: 100%; min-height: 48px; padding: 14px; margin-top: 18px;
      border: 0; border-radius: 12px; background: #0f766e;
      color: white; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .google { background: white; color: #334155; border: 1px solid #cbd5e1; }
    .google span { color: #4285f4; font-size: 19px; margin-right: 8px; }
    .switch { text-align: center; font-size: 14px; margin-top: 20px; color: #64748b; }
    .switch a { color: #0f766e; font-weight: 700; cursor: pointer; }
    .message { font-size: 14px; line-height: 1.5; margin-top: 14px; overflow-wrap: anywhere; }
    .note { font-size: 12px; line-height: 1.5; color: #64748b; margin-top: 20px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">✚ CareCue</div>
    <h1 id="heading">Create your account</h1>
    <p class="sub" id="subtitle">Your medicine schedule, organised in one place.</p>

    <form id="authForm">
      <div id="nameField">
        <label for="name">Full name *</label>
        <input id="name" name="name" type="text"
               autocomplete="name" placeholder="Enter your full name" required>
      </div>

      <label for="email">Email address *</label>
      <input id="email" name="email" type="email" autocomplete="email"
             placeholder="you@example.com" required>

      <label for="password">Password *</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password" minlength="8"
             placeholder="At least 8 characters" required>

      <label for="phone">Phone number (optional)</label>
      <input id="phone" name="phone" type="tel" inputmode="tel"
             autocomplete="tel" placeholder="+91 XXXXX XXXXX">

      <button id="submitButton" type="submit">Create account</button>
    </form>

    <button class="google" id="googleButton" type="button">
      <span>G</span> Continue with Google
    </button>

    <p class="switch">
      <span id="switchText">Already have an account?</span>
      <a id="switchMode" href="#">Sign in</a>
    </p>

    <p class="message" id="message" role="status" aria-live="polite"></p>
    <p class="note" id="note">
      Authentication setup is pending. No account will be created until a real authentication provider is connected.
    </p>
  </main>

  <script>
    const form = document.getElementById("authForm");
    const nameField = document.getElementById("nameField");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const phoneInput = document.getElementById("phone");
    const heading = document.getElementById("heading");
    const subtitle = document.getElementById("subtitle");
    const submitButton = document.getElementById("submitButton");
    const switchText = document.getElementById("switchText");
    const switchMode = document.getElementById("switchMode");
    const googleButton = document.getElementById("googleButton");
    const message = document.getElementById("message");

    let isSignup = true;

    function showMessage(text, error = false) {
      message.textContent = text;
      message.style.color = error ? "#b91c1c" : "#0f766e";
    }

    switchMode.addEventListener("click", event => {
      event.preventDefault();
      isSignup = !isSignup;

      nameField.hidden = !isSignup;
      nameInput.required = isSignup;
      heading.textContent = isSignup ? "Create your account" : "Welcome back";
      subtitle.textContent = isSignup
        ? "Your medicine schedule, organised in one place."
        : "Sign in to continue to CareCue.";
      submitButton.textContent = isSignup ? "Create account" : "Sign in";
      switchText.textContent = isSignup
        ? "Already have an account?" : "New to CareCue?";
      switchMode.textContent = isSignup ? "Sign in" : "Create account";
      passwordInput.autocomplete = isSignup ? "new-password" : "current-password";
      passwordInput.value = "";
      showMessage("");
    });

    form.addEventListener("submit", event => {
      event.preventDefault();

      if (!form.reportValidity()) return;

      if (isSignup && !nameInput.value.trim()) {
        showMessage("Please enter your full name.", true);
        nameInput.focus();
        return;
      }

      showMessage(
        "Authentication is not connected yet. Your details were not saved. Connect Supabase before using Sign Up or Sign In."
      );
    });

    googleButton.addEventListener("click", () => {
      showMessage(
        "Google authentication is not configured yet. No Google account has been signed in."
      );
    });
  </script>
</body>
</html>
